<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gypsotheca | Canova</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #c5a059; --bg: #050505; }
        
        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: 'Cinzel', serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* Sfondo con trama marmo leggera */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/black-linen.png');
            opacity: 0.2; z-index: -1;
        }

        header { padding: 50px 0; text-align: center; }
        h1 { letter-spacing: 15px; font-weight: 400; margin: 0; font-size: 1.5rem; color: var(--accent); }

        .gallery-viewport {
            flex: 1; display: flex; align-items: center;
            overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 0 25vw; gap: 80px;
            scrollbar-width: none;
            /* Riflesso globale per tutte le card */
            -webkit-box-reflect: below 10px linear-gradient(transparent, rgba(0,0,0,0.2));
        }
        .gallery-viewport::-webkit-scrollbar { display: none; }

        .statue-item {
            min-width: 350px; height: 60vh;
            scroll-snap-align: center;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* Numero in sottofondo */
        .bg-number {
            position: absolute; top: -40px; left: -20px;
            font-size: 8rem; color: rgba(255,255,255,0.03);
            z-index: -1; font-weight: 700;
        }

        .frame {
            position: relative; flex: 1;
            border: 1px solid rgba(197, 160, 89, 0.4);
            padding: 30px;
            background: linear-gradient(45deg, rgba(255,255,255,0.01), rgba(255,255,255,0.05));
            display: flex; align-items: center; justify-content: center;
            transition: 0.5s;
        }

        /* Angoli d'oro iconici */
        .frame::before, .frame::after {
            content: ''; position: absolute; width: 30px; height: 30px;
            border: 2px solid var(--accent);
        }
        .frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .statue-img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            filter: grayscale(1) brightness(0.7);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .statue-info { padding: 30px 0; text-align: center; }
        .statue-info h2 { font-size: 1.2rem; letter-spacing: 4px; margin: 5px 0; }
        .statue-info span { color: var(--accent); font-size: 0.6rem; letter-spacing: 5px; text-transform: uppercase; }

        /* Effetto Focus all'hover */
        .statue-item:hover .frame { border-color: var(--accent); transform: translateY(-10px); }
        .statue-item:hover .statue-img { filter: grayscale(0) brightness(1.1); transform: scale(1.05); }

        .explore-btn {
            margin-top: 15px; display: inline-block;
            padding: 10px 25px; border: 1px solid var(--accent);
            color: var(--accent); text-decoration: none;
            font-size: 0.7rem; letter-spacing: 3px; transition: 0.4s;
        }
        .explore-btn:hover { background: var(--accent); color: #000; }

        .nav-hint { padding: 30px; text-align: center; font-size: 0.6rem; letter-spacing: 5px; opacity: 0.3; }
    </style>
</head>
<body>

<header><h1>GYPSOTHECA</h1></header>

<div class="gallery-viewport">
    <div class="statue-item">
        <div class="bg-number">01</div>
        <div class="frame">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Orpheus_and_Eurydice_by_Canova_-_Museo_Correr.jpg" class="statue-img">
        </div>
        <div class="statue-info">
            <span>The Lovers</span>
            <h2>Orfeo ed Euridice</h2>
            <a href="museo.html" class="explore-btn">Dettagli</a>
        </div>
    </div>

    <div class="statue-item">
        <div class="bg-number">02</div>
        <div class="frame">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Ercole_e_Lica_Canova.jpg" class="statue-img">
        </div>
        <div class="statue-info">
            <span>The Fury</span>
            <h2>Ercole e Lica</h2>
            <a href="museo.html" class="explore-btn">Dettagli</a>
        </div>
    </div>
    
    </div>

<div class="nav-hint">Scorri l'archivio</div>

</body>
</html>
